---
layout: default
---
<div class="reading-container">
    <nav class="post-nav animate-enter">
        <a href="{{ '/' | relative_url }}" class="nav-back">← Back to homepage</a>
    </nav>

    <article class="animate-enter" style="animation-delay: 0.05s;">
        <header class="article-header">
            <h1 class="page-title">{{ page.title }}</h1>
            {% if page.description %}
            <p class="page-intro">{{ page.description }}</p>
            {% endif %}
        </header>

        <div class="article-body">
            {{ content }}
        </div>
    </article>
</div>
